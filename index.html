<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>移動停車場</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#50657d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="移動停車場">
  <link rel="apple-touch-icon" href="parking-icon-180.png">
  <link rel="icon" href="parking-icon-192.png">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: repeating-linear-gradient(90deg, #cfd8e3 0 60px, #dde4ec 60px 110px, #c3cedb 110px 130px, #dde4ec 130px 180px);
      user-select: none; -webkit-user-select: none; color: #34414f;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    }
    button { font-family: inherit; cursor: pointer; }
    .screen { display: none; flex-direction: column; align-items: center; gap: 14px; min-height: calc(100vh - 32px); padding-top: 70px; position: relative; }
    .screen.active { display: flex; }

    .round-btn {
      position: absolute; top: 0; left: 0; z-index: 5;
      width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff;
      background: #f06a1f; color: #fff; font-size: 30px; text-decoration: none;
      box-shadow: 0 3px 6px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; padding: 0;
    }
    h1 { margin: 0 0 6px; font-size: clamp(34px, 6vw, 50px); color: #fff; text-shadow: 0 3px 0 #50657d, 0 6px 10px rgba(0,0,0,.2); }
    .big-btn {
      width: min(440px, 90vw); padding: 14px; font-size: 28px; font-weight: bold;
      border: 5px solid #f06a1f; border-radius: 20px; background: #fdf6c3; color: #e0561a; box-shadow: 0 4px 0 #c84f15;
    }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c84f15; }
    .big-btn small { display: block; font-size: 17px; color: #8a6d3b; font-weight: normal; }
    .rules { width: min(600px, 92vw); background: #fffdf2; border-radius: 18px; padding: 12px 18px; font-size: 20px; line-height: 1.6; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
    .rules b { color: #d32f2f; }

    /* 關卡表 */
    .tiers { display: grid; gap: 12px; width: min(760px, 94vw); }
    .tier { display: flex; align-items: center; gap: 10px; background: #fffdf2; border-radius: 18px; padding: 10px 12px; box-shadow: 0 3px 8px rgba(0,0,0,.1); }
    .tier .tn { width: 92px; flex: none; text-align: center; font-size: 24px; font-weight: bold; color: #34414f; line-height: 1.15; }
    .tier .tn small { display: block; font-size: 14px; font-weight: normal; color: #6b7785; }
    .tier .lvs { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .lv-btn { position: relative; min-height: 70px; font-size: 19px; font-weight: bold; border-radius: 14px; border: 4px solid #f06a1f; background: #fdf6c3; color: #e0561a; box-shadow: 0 3px 0 #c84f15; padding: 4px 2px; line-height: 1.2; }
    .lv-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c84f15; }
    .lv-btn small { display: block; font-size: 13px; font-weight: normal; color: #8a6d3b; }
    .lv-btn .got { display: block; font-size: 13px; color: #2e7d32; min-height: 1.1em; }
    .lv-btn.done { background: #e2f5dc; border-color: #4f9a45; color: #2f5e28; box-shadow: 0 3px 0 #3b7a33; }
    .lv-btn.next { background: #fff0a8; box-shadow: 0 3px 0 #c84f15, 0 0 0 4px #ffd24d; }
    .lv-btn.next::after { content: '👉'; position: absolute; top: -14px; right: -8px; font-size: 22px; }

    /* 遊戲 */
    .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 21px; font-weight: bold; }
    .top .level { background: #fff; border-radius: 999px; padding: 4px 14px; }
    .top .moves { background: #34414f; color: #fff; border-radius: 999px; padding: 4px 14px; }
    .msg { min-height: 1.5em; font-size: clamp(21px, 3.4vw, 28px); font-weight: bold; text-align: center; color: #34414f; }
    .lot { position: relative; width: min(84vw, 56vh, 540px); aspect-ratio: 1; margin-right: min(8vw, 50px); }
    .board {
      --n: 6; position: absolute; inset: 0; border-radius: 14px; border: 8px solid #5b6b7d; touch-action: none;
      background-color: #8d9aa8;
      background-image: linear-gradient(rgba(255,255,255,.18) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.18) 2px, transparent 2px);
      background-size: calc(100% / var(--n)) calc(100% / var(--n));
    }
    .exit { position: absolute; right: -8px; width: 12px; background: #8d9aa8; }
    .exit-label { position: absolute; left: calc(100% + 8px); display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 17px; font-weight: bold; color: #d32f2f; white-space: nowrap; line-height: 1.1; }
    .exit-label b { font-size: 30px; animation: nudge 1.2s infinite; }
    .car { position: absolute; padding: 7px; touch-action: none; cursor: grab; z-index: 1; }
    .car.drag { z-index: 2; }
    /* 車子零件：車輪、前擋風玻璃、後車窗、車頭燈、車尾燈（位置由 carParts() 依車頭方向算） */
    .car .part { position: absolute; }
    .car .wheel { z-index: -1; border-radius: 30%; background: radial-gradient(circle, #9e9e9e 0 22%, #2b2b2b 26%); }
    .car .glass { background: rgba(200,230,255,.92); border-radius: 22%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }
    .car .glass.front { background: linear-gradient(135deg, #e3f4ff, #a9d6f5); }
    .car .head { background: #fff59d; border-radius: 40%; box-shadow: 0 0 6px 2px rgba(255,241,118,.8); }
    .car .tail { background: #ff1744; border-radius: 30%; }
    .car .body.red .tail { background: #7f0000; }
    .car.anim { transition: left .18s, top .18s; }
    .car.leave { transition: left .6s ease-in; }
    .car .body { width: 100%; height: 100%; border-radius: 12px; position: relative; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2), 0 3px 5px rgba(0,0,0,.25);
      display: flex; align-items: center; justify-content: center; font-size: calc(min(84vw, 56vh, 540px) / var(--n) * .42); }
    /* 車窗 */
    .car.drag .body { box-shadow: 0 0 0 4px #fff, 0 6px 12px rgba(0,0,0,.35); }
    .car.hint .body { animation: glow .8s infinite alternate; }
    .car .arrow { position: relative; z-index: 1; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
    .car .body.white { box-shadow: inset 0 0 0 3px #9aa5b1, inset 0 -5px 0 rgba(0,0,0,.15), 0 3px 5px rgba(0,0,0,.25); }

    .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .tools button { font-size: 20px; font-weight: bold; padding: 10px 16px; border-radius: 14px; border: 3px solid #f06a1f; background: #fdf6c3; color: #e0561a; box-shadow: 0 3px 0 #c84f15; }
    .tools button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c84f15; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
    .overlay.show { display: flex; }
    .overlay .card { background: #fdf8dc; border: 6px solid #f06a1f; border-radius: 24px; padding: 26px 30px; text-align: center; max-width: 480px; }
    .overlay h2 { color: #e0561a; font-size: 40px; margin: 0; }
    .overlay .big-stars { font-size: 58px; margin: 8px 0; }
    .overlay p { font-size: 21px; margin: 6px 0 16px; line-height: 1.5; }
    .overlay .big-btn { width: 100%; margin-top: 10px; font-size: 25px; }

    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes glow { from { box-shadow: 0 0 0 3px #fff, 0 0 12px 4px #ffeb3b; } to { box-shadow: 0 0 0 6px #ffeb3b, 0 0 22px 8px #ffeb3b; } }
    @media (max-width: 600px) { .tier { flex-direction: column; } .tier .tn { width: auto; } .tier .lvs { width: 100%; } }
  </style>
</head>
<body>

<!-- ============ 選單 ============ -->
<div class="screen active" id="menu">
  <a href="https://alphones66.github.io/clock-practice/" class="round-btn" aria-label="回時鐘練習">🏠</a>
  <h1>🚗 移動停車場</h1>
  <div class="rules">
    把擋路的車子<b>前後滑開</b>，讓 <b>⭐紅車</b> 從右邊的<b>出口</b>開出去！<br>
    <small>橫的車只能左右滑，直的車只能上下滑。從入門開始，一關一關往上。做完的關卡會換新題目，不會重複。</small>
  </div>
  <div class="tiers" id="tiers"></div>
  <button class="big-btn" id="resume" hidden>▶ 繼續上次的關卡<small></small></button>
</div>

<!-- ============ 遊戲 ============ -->
<div class="screen" id="game">
  <button class="round-btn" data-act="menu" aria-label="回關卡表">↩</button>
  <div class="top"><span class="level" id="level"></span><span class="moves" id="moves"></span></div>
  <div class="msg" id="msg"></div>
  <div class="lot"><div class="board" id="board"></div></div>
  <div class="tools">
    <button data-act="undo">↶ 退一步</button>
    <button data-act="hint">💡 提示</button>
    <button data-act="reset">🔁 重來</button>
  </div>
</div>

<div class="overlay" id="win">
  <div class="card">
    <h2>開出去了！</h2>
    <div class="big-stars" id="win-stars"></div>
    <p id="win-text"></p>
    <button class="big-btn" id="next-lv" data-act="next">▶ 下一關</button>
    <button class="big-btn" data-act="reset">🆕 這關換一題</button>
    <button class="big-btn" data-act="menu">回關卡表</button>
  </div>
</div>

// 把盤面文字變成車子清單：{ h: 橫的嗎, len, fix: 固定的排/行 } 和每台車現在的位置
function parse(str, n) {
  const ids = [...new Set(str.replace(/\./g, ''))].sort();
  const cars = [], pos = [];
  ids.forEach(id => {
    const cells = [...str].map((ch, k) => ch === id ? k : -1).filter(k => k >= 0);
    const r0 = Math.floor(cells[0] / n), c0 = cells[0] % n;
    const h = cells.length > 1 && Math.floor(cells[1] / n) === r0;
    cars.push({ id, h, len: cells.length, fix: h ? r0 : c0 });
    pos.push(h ? c0 : r0);
  });
  return { cars, pos };
}

// ---------- 規則和解題（提示用）----------
function occupancy(n, cars, pos, skip = -1) {
  const g = new Array(n * n).fill(-1);
  cars.forEach((c, i) => { if (i !== skip) for (let k = 0; k < c.len; k++) g[c.h ? c.fix * n + pos[i] + k : (pos[i] + k) * n + c.fix] = i; });
  return g;
}
// 這台車可以滑到哪裡（最前、最後）
function rangeOf(n, cars, pos, i) {
  const g = occupancy(n, cars, pos, i), c = cars[i], at = p => c.h ? c.fix * n + p : p * n + c.fix;
  let lo = pos[i], hi = pos[i];
  while (lo - 1 >= 0 && g[at(lo - 1)] === -1) lo--;
  while (hi + c.len < n && g[at(hi + c.len)] === -1) hi++;
  return [lo, hi];
}
function neighbors(n, cars, pos) {
  const out = [];
  cars.forEach((c, i) => {
    const [lo, hi] = rangeOf(n, cars, pos, i);
    for (let p = lo; p <= hi; p++) if (p !== pos[i]) { const q = [...pos]; q[i] = p; out.push([q, i, p]); }
  });
  return out;
}
const isSolved = (n, pos) => pos[0] === n - 2;
// 從現在的樣子找最少步數的走法，回傳第一步 [第幾台車, 移到哪]
function firstMove(n, cars, start) {
  const key = p => p.join(','), prev = new Map([[key(start), null]]), queue = [start];
  for (let h = 0; h < queue.length; h++) {
    const p = queue[h];
    if (isSolved(n, p)) {
      let k = key(p), step = null;
      while (prev.get(k)) { step = prev.get(k); k = step.from; }
      return step ? [step.car, step.to] : null;
    }
    for (const [q, i, to] of neighbors(n, cars, p)) {
      const kq = key(q);
      if (!prev.has(kq)) { prev.set(kq, { from: key(p), car: i, to }); queue.push(q); }
    }
  }
  return null;
}

  store.save();
  if (!saved) {
    const m = t === 0 && i === 0 ? '用手指按住車子滑動，讓紅車開出去' : '讓紅車開出去！';
    setMsg(m); say(m);
  } else setMsg('接著上次的關卡');
}

// 車頭朝哪裡：紅車朝出口（右）；其他車輪流朝兩個方向，看起來比較像真的停車場
const faceOf = (c, i) => c.h ? (i === 0 || i % 2 ? 'r' : 'l') : (i % 2 ? 'd' : 'u');
// 車子的零件。a = 離車頭多遠、b = 離車尾多遠、s = 沿著車身的長度、x = 離車身側邊多遠、w = 寬度（都是 %）
// 長度用「兩格車」當基準，三格的卡車零件不會被拉長
const PARTS = [
  ['glass front', { a: 17, s: 15, x: 14, w: 72 }], ['glass', { b: 11, s: 10, x: 20, w: 60 }],
  ['head', { a: 1, s: 6, x: 8, w: 20 }], ['head', { a: 1, s: 6, x: 72, w: 20 }],
  ['tail', { b: 1, s: 5, x: 10, w: 18 }], ['tail', { b: 1, s: 5, x: 72, w: 18 }],
  ['wheel', { a: 13, s: 17, x: -10, w: 28 }], ['wheel', { a: 13, s: 17, x: 82, w: 28 }],
  ['wheel', { b: 13, s: 17, x: -10, w: 28 }], ['wheel', { b: 13, s: 17, x: 82, w: 28 }],
];
function carParts(c, face) {
  const k = 2 / c.len;
  return PARTS.map(([cls, q]) => {
    const size = q.s * k, fromFront = q.a != null ? q.a * k : 100 - q.b * k - size;
    const along = { r: 'right', l: 'left', d: 'bottom', u: 'top' }[face];
    const lenProp = c.h ? 'width' : 'height', side = c.h ? 'top' : 'left', wProp = c.h ? 'height' : 'width';
    return `<i class="part ${cls}" style="${along}:${fromFront}%;${lenProp}:${size}%;${side}:${q.x}%;${wProp}:${q.w}%"></i>`;
  }).join('');
}
// 車頭圓一點、車尾方一點
const RADIUS = { r: '10% 26% 26% 10% / 16% 36% 36% 16%', l: '26% 10% 10% 26% / 36% 16% 16% 36%',
                 d: '16% 16% 36% 36% / 10% 10% 26% 26%', u: '36% 36% 16% 16% / 26% 26% 10% 10%' };

// 畫停車場和車子
function build() {
  const { n, cars } = G, board = $('board'), cell = 100 / n;
  board.style.setProperty('--n', n);
  board.innerHTML = cars.map((c, i) => `<div class="car anim ${c.h ? 'h' : 'v'}" data-i="${i}" style="--len:${c.len};width:${c.h ? c.len * cell : cell}%;height:${c.h ? cell : c.len * cell}%">
    <div class="body${COLORS[i % COLORS.length][1] === '白車' ? ' white' : ''}${i === 0 ? ' red' : ''}" style="background:${COLORS[i % COLORS.length][0]};border-radius:${RADIUS[faceOf(c, i)]}"><span class="arrow">${COLORS[i % COLORS.length][2]}</span>${carParts(c, faceOf(c, i))}</div></div>`).join('');
  // 出口：右邊框留一個缺口
  const lot = board.parentElement;
  lot.querySelectorAll('.exit, .exit-label').forEach(e => e.remove());
  const top = `${EXIT_ROW[n] * cell}%`, h = `${cell}%`;
  board.insertAdjacentHTML('beforeend', `<div class="exit" style="top:${EXIT_ROW[n] * cell}%;height:${cell}%"></div>`);
  lot.insertAdjacentHTML('beforeend', `<div class="exit-label" style="top:${top};height:${h}"><b>➡</b>出口</div>`);
}
function place(i, p) {
  const c = G.cars[i], el = document.querySelector(`.car[data-i="${i}"]`), cell = 100 / G.n;
  el.style.left = (c.h ? p : c.fix) * cell + '%';
  el.style.top = (c.h ? c.fix : p) * cell + '%';
}
function update() {
  G.cars.forEach((_, i) => place(i, G.pos[i]));
  $('moves').textContent = `走了 ${G.moves} 步（最少 ${G.min} 步）`;
}

// 移動一台車（算一步），紅車到出口就過關
function moveCar(i, p) {
  if (p === G.pos[i]) return;
  G.history.push([i, G.pos[i]]);
  G.pos[i] = p; G.moves++;
  document.querySelectorAll('.car.hint').forEach(e => e.classList.remove('hint'));
  update(); store.save();
  if (isSolved(G.n, G.pos)) return win();
  setMsg(G.moves === 1 ? '很好，繼續！' : '');
}

function win() {
  G.won = true; store.clear();
  const L = [null, G.min];
  done.add(lvKey(G.t, G.i));      // 完成了，這一關下次換新題目
  // 紅車開出去的動畫
  const el = document.querySelector('.car[data-i="0"]');
  el.classList.add('leave'); requestAnimationFrame(() => { el.style.left = '110%'; });
  const perfect = G.moves <= L[1];
  $('win-stars').textContent = perfect ? '🌟🌟🌟' : '🌟🌟';
  $('win-text').innerHTML = perfect ? `用 ${G.moves} 步就開出去，<br>是最少的步數，太厲害了！` : `用了 ${G.moves} 步，完成了！<br>這關最少可以 ${L[1]} 步，下次可以挑戰看看`;
  const nx = nextOf(G.t, G.i);
  $('next-lv').hidden = !nx;
  if (nx) $('next-lv').innerHTML = `▶ 下一關<small>${lvName(...nx)}${nx[0] !== G.t ? '（升級了！）' : ''}</small>`;
  setMsg('🎉 紅車開出去了！');
  setTimeout(() => { $('win').classList.add('show'); say(perfect ? '太厲害了！最少步數！' : '開出去了！好棒！'); }, 800);
}

// ---------- 拖動車子 ----------
let drag = null;
$('board').addEventListener('pointerdown', e => {
  const el = e.target.closest('.car');
  if (!el || !G || G.won) return;
  const i = +el.dataset.i, [lo, hi] = rangeOf(G.n, G.cars, G.pos, i);
  const cellPx = $('board').clientWidth / G.n;
  drag = { i, el, lo, hi, x: e.clientX, y: e.clientY, from: G.pos[i], cellPx, cur: G.pos[i] };
  el.classList.add('drag'); el.classList.remove('anim');
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
});
$('board').addEventListener('pointermove', e => {
  if (!drag) return;
  const c = G.cars[drag.i], d = ((c.h ? e.clientX - drag.x : e.clientY - drag.y)) / drag.cellPx;
  drag.cur = Math.max(drag.lo, Math.min(drag.hi, drag.from + d));
  const cell = 100 / G.n;
  drag.el.style[c.h ? 'left' : 'top'] = drag.cur * cell + '%';
});
function endDrag() {
  if (!drag) return;
  const { i, el, lo, hi } = drag, p = Math.round(drag.cur);
  el.classList.remove('drag'); el.classList.add('anim');
  drag = null;
  if (p === G.pos[i]) {
    place(i, p);
    if (lo === hi) { setMsg(`${carLabel(i)}被擋住了，先移開別的車`); say(`${carSpeech(i)}被擋住了，先移開別的車`); }
    return;
  }
  moveCar(i, p);
}
$('board').addEventListener('pointerup', endDrag);
$('board').addEventListener('pointercancel', endDrag);

// ---------- 按鈕 ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.lv) { const [a, b] = t.dataset.lv.split('-').map(Number); return start(a, b); }
  if (t.id === 'resume') { const s = store.load(); if (s) start(s.t, s.i, s); return; }
  const act = t.dataset.act;
  if (act === 'menu') return showMenu();
  if (act === 'next') { const nx = nextOf(G.t, G.i); return nx ? start(...nx) : showMenu(); }
  if (act === 'reset') return G.won ? start(G.t, G.i) : (start(G.t, G.i, { p: G.p, pos: [...G.start], moves: 0, history: [] }), setMsg('重新開始這一題'));
  if (act === 'undo') {
    if (G.won || !G.history.length) return setMsg('還沒有移動過');
    const [i, p] = G.history.pop();
    G.pos[i] = p; G.moves = Math.max(0, G.moves - 1);
    update(); store.save(); setMsg('退回一步');
    return;
  }
  if (act === 'hint') {
    if (G.won) return;
    const mv = firstMove(G.n, G.cars, G.pos);
    if (!mv) return;
    const [i, to] = mv, c = G.cars[i];
    const dir = c.h ? (to > G.pos[i] ? '往右' : '往左') : (to > G.pos[i] ? '往下' : '往上');
    const el = document.querySelector(`.car[data-i="${i}"]`);
    document.querySelectorAll('.car.hint').forEach(e => e.classList.remove('hint'));
    el.classList.add('hint');
    const k = Math.abs(to - G.pos[i]);
    setMsg(`💡 把${carLabel(i)}${dir}移 ${k} 格`); say(`把${carSpeech(i)}${dir}移 ${k} 格`);
  }
});

showMenu();
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js');
</script>
<script src="music.js" data-style="playful"></script>
</body>
